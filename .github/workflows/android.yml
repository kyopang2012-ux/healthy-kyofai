name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key from repository secrets."
          else
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret. The APK is signed with a throwaway debug key, so it cannot update an earlier install."
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "HealthyKyoFai-v1.2.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: HealthyKyoFai-apk
          path: HealthyKyoFai-*.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: Healthy KyoFai v1.2.${{ github.run_number }}
          make_latest: true
          files: HealthyKyoFai-*.apk
          body: |
            用手機開呢頁，撳下面嘅 `HealthyKyoFai-v1.2.${{ github.run_number }}.apk` 下載安裝。
            第一次安裝要喺 Android 設定允許「安裝不明來源嘅 app」。之後嘅版本直接安裝就會覆蓋舊版，記錄會保留。
