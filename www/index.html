<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Healthy KyoFai</title>
<meta name="description" content="記錄每日飲食同運動：影相俾 AI 估卡路里、MET 計運動消耗、飲水、體重進度，一鍵匯出 Excel。">
<meta name="theme-color" content="#15120f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Healthy KyoFai">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Crect width='44' height='44' rx='10' fill='%2315120f'/%3E%3Ccircle cx='22' cy='22' r='16' fill='none' stroke='%23f2b04f' stroke-width='3.5'/%3E%3Cpath d='M12 22h20a10 10 0 0 1-20 0z' fill='%23f2b04f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700;900&family=Urbanist:wght@500;600;700;800&display=swap">
<script defer src="vendor/exceljs.min.js" onerror="var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';document.head.appendChild(s);"></script>
<style>
/* Layout: one phone-width column, cards on warm charcoal, fixed tab bar; amber = eating, teal = moving */
:root{
  --bg:#15120f;
  --surface:#221e1a;
  --surface-2:#2c2823;
  --line:#3a342d;
  --track:#35302a;
  --fg:#f5efe6;
  --muted:#a89f92;
  --dim:#736b60;
  --amber:#f2b04f;
  --amber-ink:#2b1d07;
  --amber-soft:rgba(242,176,79,.14);
  --teal:#7fb5ab;
  --teal-ink:#0e2421;
  --teal-soft:rgba(127,181,171,.15);
  --water:#79b4d9;
  --protein:#e58b7c;
  --carbs:#dcb86b;
  --fat:#9fc8bf;
  --bad:#ec7b68;
  --good:#9ccf86;
  --font-num:"Urbanist","Noto Sans HK","PingFang HK",system-ui,sans-serif;
  --font-body:"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
html{padding-top:env(safe-area-inset-top, 0px)}
img{max-width:100%}
[hidden]{display:none!important}
body{color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:8px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.app{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:10px calc(104px + env(safe-area-inset-bottom, 0px))}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand{min-width:0}
.brand svg{width:40px;height:40px;flex:none}
.brand-name{display:block;font-family:var(--font-num);font-weight:600;font-size:21px;line-height:1.15;letter-spacing:.005em;white-space:nowrap}
.brand-name b{font-weight:800;color:var(--amber)}
.brand-sub{display:block;font-size:11.5px;color:var(--dim);font-weight:500;letter-spacing:.12em;margin-top:2px}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.updated{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap;letter-spacing:.02em}
.top-act{display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.icon-btn[aria-pressed="false"]{color:var(--amber);border-color:rgba(242,176,79,.45)}
.streak{display:flex;align-items:center;gap:6px;height:38px;padding:0 13px;border-radius:19px;background:var(--surface);border:1px solid var(--line);color:var(--amber);font-family:var(--font-num);font-weight:700;font-size:18px}
.streak svg{width:18px;height:18px}

/* cards & text */
.card{background:var(--surface);border-radius:var(--r-lg);padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
h2.sec{font-size:20px;font-weight:900;margin:8px 0 0;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h2.sec small{font-size:13px;font-weight:500;color:var(--dim)}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.amber{color:var(--amber)}
.teal{color:var(--teal)}
.note{font-size:13px;color:var(--muted);margin:0;line-height:1.6}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:999px;background:var(--surface-2);color:var(--muted);letter-spacing:.02em}
.tag svg{width:14px;height:14px}
.tag-teal{background:var(--teal-soft);color:var(--teal)}
.tag-amber{background:var(--amber-soft);color:var(--amber)}
.masked{letter-spacing:.12em;color:var(--dim)}

/* week strip */
.week{display:grid;grid-template-columns:28px 1fr 28px;align-items:center;gap:2px;background:var(--surface);border-radius:var(--r-lg);padding:10px 4px}
.wk-nav{height:56px;display:grid;place-items:center;color:var(--dim);border-radius:10px}
.wk-nav:disabled{opacity:.25;cursor:default}
.wk-days{display:grid;grid-template-columns:repeat(7,1fr)}
.wk-day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border-radius:12px;color:var(--fg)}
.wk-day:disabled{opacity:.3;cursor:default}
.wk-day .wd{font-size:12px;color:var(--dim)}
.wk-day .dn{font-family:var(--font-num);font-weight:700;font-size:18px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.wk-day.sel .dn{background:var(--amber);color:var(--amber-ink)}
.wk-day.today:not(.sel) .dn{box-shadow:inset 0 0 0 1.5px var(--amber)}
.wk-day .dot{width:5px;height:5px;border-radius:50%;background:transparent}
.wk-day.has .dot{background:var(--amber)}

/* calorie card */
.cal-main{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cal-text{min-width:0}
.hero{font-family:var(--font-num);font-weight:800;font-size:58px;line-height:1;letter-spacing:-.01em;margin-top:12px}
.hero.over{color:var(--bad)}
.cal-lbl{color:var(--muted);font-size:15px;margin-top:4px}
.cal-eq{margin-top:10px;font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.cal-eq b{font-weight:700}
.ring-wrap{position:relative;flex:none;display:grid;place-items:center}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring-in svg{width:26px;height:26px;color:var(--amber)}
.ring-in .num{font-weight:700;font-size:15px;color:var(--muted)}
.cal-foot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.mini{background:var(--surface-2);border-radius:var(--r-sm);padding:9px 10px;text-align:center;font-size:13px;color:var(--muted)}
.mini b{color:var(--fg);font-family:var(--font-num);font-size:17px;margin:0 2px}
.empty-cal{display:flex;flex-direction:column;gap:12px;align-items:flex-start}

/* macros */
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mac{background:var(--surface);border-radius:var(--r-md);padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.mac .ring-in svg{width:20px;height:20px}
.mac-l{font-size:13px;color:var(--muted)}
.mac-v{font-size:13px;color:var(--dim)}
.mac-v b{font-family:var(--font-num);font-size:19px;color:var(--fg);font-weight:700}

/* buttons */
.cta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-md);padding:14px 16px;font-weight:900;font-size:16px;letter-spacing:.02em;transition:transform .12s ease,filter .12s ease}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:default}
.btn.big{min-height:64px;font-size:18px;border-radius:18px}
.btn.amber{background:var(--amber);color:var(--amber-ink)}
.btn.teal{background:var(--teal);color:var(--teal-ink)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(236,123,104,.4)}
.btn.block{width:100%}
.link{color:var(--amber);font-weight:700;font-size:14px;padding:6px 0}

/* log entries */
.log{display:flex;flex-direction:column;gap:8px}
.entry{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:var(--r-md);padding:10px 14px 10px 10px;text-align:left;width:100%}
.thumb{width:56px;height:56px;border-radius:12px;background:var(--surface-2);overflow:hidden;display:grid;place-items:center;color:var(--amber);font-size:24px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.ex{background:var(--teal-soft);border-radius:50%}
.e-body{min-width:0}
.e-top{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim)}
.e-src{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.e-name{font-weight:700;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.e-mac{font-size:12.5px;color:var(--muted)}
.e-kcal{text-align:right;font-weight:700;font-size:20px;line-height:1.1}
.e-kcal small{display:block;font-size:11.5px;color:var(--dim);font-weight:600}
.e-kcal.ex{color:var(--teal)}
.empty{background:var(--surface);border-radius:var(--r-md);padding:22px 18px;color:var(--muted);font-size:14px;line-height:1.7;border:1px dashed var(--line)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(26,23,19,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom, 0px));padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);font-size:12.5px;font-weight:700;padding:2px 0}
.tab .pill{width:58px;height:32px;border-radius:16px;display:grid;place-items:center}
.tab.on{color:var(--amber)}
.tab.on .pill{background:var(--amber-soft)}

/* sheet */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(8,6,4,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:600px;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:#1b1815;border-radius:26px 26px 0 0;padding-top:10px;padding-bottom:calc(22px + env(safe-area-inset-bottom, 0px));padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.sh-head h3{margin:0;font-size:26px;font-weight:900}
.sh-sub{font-size:13px;color:var(--dim);margin-bottom:14px}
.sh-body{display:flex;flex-direction:column;gap:14px}
.lbl{font-size:14px;color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:14px;font-weight:700}
.chip.on{background:var(--amber);color:var(--amber-ink)}
.pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:118px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:center;padding:12px}
.pick svg.ic{width:34px;height:34px;color:var(--amber)}
.pick span{font-weight:900;font-size:18px}
.pick small{font-size:12px;color:var(--dim)}
.pick.wide{grid-column:1/-1;min-height:70px;flex-direction:row;gap:12px}
.pick.wide svg.ic{width:26px;height:26px}
.preview{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r-md);display:block;background:var(--surface)}
.preview.sm{aspect-ratio:16/7}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.in{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;font-size:15px;min-width:0}
.in:focus{border-color:var(--amber);outline:none}
textarea.in{resize:vertical;min-height:84px;line-height:1.6}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(-45deg,transparent 50%,var(--muted) 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:34px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.items-h{display:flex;align-items:center;justify-content:space-between}
.item{background:var(--surface);border-radius:var(--r-md);padding:10px;display:flex;flex-direction:column;gap:8px}
.item-top{display:grid;grid-template-columns:1fr 110px 34px;gap:8px;align-items:center}
.item-top .in{padding:9px 10px}
.x{width:34px;height:34px;border-radius:50%;background:var(--surface-2);color:var(--muted);display:grid;place-items:center}
.x svg{width:16px;height:16px}
.item-nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.item-nums label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--dim);min-width:0}
.item-nums .in{padding:8px 6px;text-align:center;font-family:var(--font-num);font-weight:700}
.tot{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:6px;background:var(--amber-soft);border-radius:var(--r-md);padding:12px}
.tot div{display:flex;flex-direction:column;align-items:center;font-size:11.5px;color:var(--muted)}
.tot b{font-family:var(--font-num);font-size:18px;color:var(--fg)}
.tot div:first-child b{color:var(--amber);font-size:24px}
.ai-note{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:var(--r-md);padding:12px;font-size:13.5px;color:var(--muted);line-height:1.6}
.ai-note svg{color:var(--amber);width:18px;height:18px;margin-top:2px}
.ai-note b{color:var(--fg)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-radius:var(--r-md);padding:14px 16px;font-size:15px;cursor:pointer}
.switch-row span{display:flex;align-items:center;gap:8px}
.switch-row span svg{width:18px;height:18px;color:var(--bad)}
.switch{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:15px;background:var(--surface-2);border:2px solid var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--fg);transition:transform .15s}
.switch:checked{background:var(--amber);border-color:var(--amber)}
.switch:checked::after{transform:translateX(22px);background:var(--amber-ink)}
.busy{display:flex;flex-direction:column;gap:12px;align-items:stretch;background:var(--surface);border-radius:var(--r-md);padding:16px}
.busy p{margin:0;font-size:14px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;width:40%;border-radius:3px;background:var(--amber);animation:slide 1.3s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.err{background:rgba(236,123,104,.12);color:#f3a596;border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px}
.fav-list{display:flex;flex-direction:column;gap:8px}
.fav{display:grid;grid-template-columns:1fr auto 34px;gap:10px;align-items:center;background:var(--surface);border-radius:var(--r-md);padding:10px 10px 10px 14px}
.fav button.main{text-align:left;min-width:0}
.fav .nm{font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav .sb{font-size:12.5px;color:var(--dim)}

/* exercise */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-radius:999px;padding:5px;gap:4px}
.seg button{padding:9px 6px;border-radius:999px;font-weight:700;color:var(--muted);font-size:15px}
.seg button.on{background:var(--amber);color:var(--amber-ink)}
.ex-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ex-tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px 10px;border-radius:var(--r-md);background:var(--surface);font-weight:700;font-size:14px}
.ex-tile .em{font-size:28px;line-height:1.1}
.ex-tile.on{background:var(--amber);color:var(--amber-ink)}
.ex-tile.more{color:var(--amber)}
.ex-tile.more .em{font-family:var(--font-num);font-weight:500}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r-lg);padding:12px}
.stepper button{width:56px;height:56px;border-radius:50%;background:var(--surface-2);font-size:26px;font-weight:700;font-family:var(--font-num)}
.stepper .mid{display:flex;flex-direction:column;align-items:center}
.stepper input{width:100%;max-width:140px;text-align:center;background:transparent;border:0;font-size:46px;font-weight:800;padding:0;font-family:var(--font-num)}
.stepper input:focus{outline:none;color:var(--amber)}
.stepper span{font-size:13px;color:var(--muted)}
.est{background:linear-gradient(160deg,rgba(242,176,79,.16),rgba(242,176,79,.05));border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 12px}
.est-l{width:100%;color:var(--amber);font-weight:700;font-size:15px}
.est-n{font-size:15px;color:var(--amber)}
.est-n b{font-size:46px;font-weight:800;line-height:1}
.est-f{font-size:12.5px;color:rgba(242,176,79,.7)}

/* water */
.water-hero{display:grid;grid-template-columns:110px 1fr;gap:20px;align-items:center}
.glass{position:relative;width:96px;height:170px;margin:0 auto;border:3px solid rgba(121,180,217,.55);border-top-width:0;border-radius:6px 6px 26px 26px;overflow:hidden;background:rgba(121,180,217,.06)}
.glass i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(121,180,217,.9),rgba(84,146,190,.95));transition:height .5s ease}
.glass i::before{content:"";position:absolute;left:-10%;right:-10%;top:-5px;height:10px;border-radius:50%;background:rgba(170,212,238,.9)}
.glass .lv{position:absolute;inset:auto 0 8px;text-align:center;font-family:var(--font-num);font-weight:800;font-size:18px;color:#0c1b26;mix-blend-mode:normal}
.w-big{font-family:var(--font-num);font-weight:800;font-size:44px;line-height:1;color:var(--water)}
.w-sub{color:var(--muted);font-size:14px;margin-top:4px}
.w-left{margin-top:12px;font-size:14px}
.wbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wbtn{background:var(--surface);border-radius:var(--r-md);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700}
.wbtn b{font-family:var(--font-num);font-size:22px;color:var(--water)}
.wbtn small{font-size:12px;color:var(--dim);font-weight:500}
.wrow{display:flex;gap:10px}
.wrow .in{flex:1}

/* progress */

.track{height:10px;border-radius:5px;background:var(--track);margin-top:18px;overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),#f6c97f);border-radius:5px}
.ends{display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--dim)}
.ends b{display:block;font-family:var(--font-num);font-size:18px;color:var(--fg);font-weight:700}
.ends div:last-child{text-align:right}
.eta{display:flex;justify-content:space-between;margin-top:10px;color:var(--muted);font-size:14px}
.eta b{font-family:var(--font-num);color:var(--fg);font-size:18px}
.weigh{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:16px}
.chart-wrap{margin-top:12px;overflow-x:auto}
.chart-wrap svg{display:block;width:100%;height:auto;min-width:300px}
.chart-empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:40px 10px;color:var(--dim);font-size:14px;text-align:center}
.chart-empty svg{width:44px;height:44px;color:var(--line)}
.segs{display:inline-grid;grid-auto-flow:column;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px}
.segs button{padding:6px 14px;border-radius:999px;font-family:var(--font-num);font-weight:700;color:var(--muted);font-size:14px}
.segs button.on{background:var(--amber);color:var(--amber-ink)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--surface-2);border-radius:var(--r-sm);padding:10px;text-align:center}
.stat b{display:block;font-family:var(--font-num);font-size:20px}
.stat span{font-size:12px;color:var(--dim)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--dim);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* export */
.tbl-wrap{overflow-x:auto;margin-top:12px;border-radius:var(--r-sm)}
table.tbl{border-collapse:collapse;width:100%;font-size:13px;min-width:420px}
.tbl th{font-weight:700;color:var(--muted);text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px;text-align:right;border-bottom:1px solid rgba(58,52,45,.6);font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.neg{color:var(--bad)}
.sheets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sheets span{font-size:12px;padding:4px 10px;border-radius:8px;background:var(--surface-2);color:var(--muted)}
.sheets span.off{opacity:.4;text-decoration:line-through}
.msg{font-size:13.5px;color:var(--muted);min-height:1.5em}

/* profile */
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.kv div{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px}
.kv div>span{display:block;font-size:12px;color:var(--dim)}
.kv b{font-family:var(--font-num);font-size:20px;font-weight:700}
.kv b small{font-size:13px;color:var(--muted);font-weight:500;margin-left:2px}
.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.plan-grid div{background:var(--surface-2);border-radius:var(--r-sm);padding:10px;text-align:center}
.plan-grid span{display:block;font-size:12px;color:var(--dim)}
.plan-grid b{font-family:var(--font-num);font-size:19px}
.status-line{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}

.status-line i.ok{background:var(--good)}
.status-line i.warn{background:var(--amber)}
.ver{font-size:12px;color:var(--dim);text-align:center;margin-top:6px}

.btnrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btnrow .btn{padding:12px 8px;font-size:14.5px}
.ai-ok{font-size:13px;color:var(--good)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);font-weight:700;font-size:14px;padding:10px 18px;border-radius:999px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}

@media (max-width:380px){

  .updated{font-size:10.5px;padding:2px 7px}
  .hero{font-size:48px}
  .ex-grid{grid-template-columns:repeat(3,1fr)}
  .item-top{grid-template-columns:1fr 84px 34px}
  .wt-big{font-size:54px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<script>
(() => {

/* ---------- helpers ---------- */

  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },

const AI_MODELS = [
  {v:"claude-sonnet-5-5", l:"Claude Sonnet 5.5（較準，建議）"},
  {v:"claude-haiku-5-5", l:"Claude Haiku 5.5（較快、較平）"},
];
const aiCfg = () => { const c = LS.get(K_AI) || {}; return {key:String(c.key || ""), model:AI_MODELS.some(m => m.v === c.model) ? c.model : AI_MODELS[0].v}; };
const blobToB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = () => rej(r.error); r.readAsDataURL(b); });

  try { return JSON.parse(t); } catch (e) {}

  if (m) { try { return JSON.parse(m[1]); } catch (e) {} }
  const a = t.search(/[\[{]/), b = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) {} }
  return undefined;
}
/* Same call shape as the artifact `sample` capability, backed by the person's own Anthropic API key. */
function makeApiAi(cfg) {
  const call = async (prompt, opts = {}) => {
    const content = [];
    for (const b of (opts.images || [])) if (b) content.push({type:"image", source:{type:"base64", media_type:"image/jpeg", data:await blobToB64(b)}});
    content.push({type:"text", text:prompt});
    let res;
    try {
      res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST", signal:opts.signal,
        headers:{"content-type":"application/json", "x-api-key":cfg.key, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:cfg.model, max_tokens:4096, messages:[{role:"user", content}]}),

    } catch (e) { throw {code:e && e.name === "AbortError" ? "cancelled" : "network", message:String(e && e.message || e)}; }
    if (!res.ok) {
      let msg = ""; try { const j = await res.json(); msg = j && j.error && j.error.message || ""; } catch (e) {}
      const s = res.status;
      throw {code:s === 401 || s === 403 ? "auth" : s === 429 ? "rate_limited" : s === 400 || s === 404 ? "bad_request" : s >= 500 ? "overloaded" : "upstream_error", message:msg, status:s};
    }
    const j = await res.json();
    if (j.stop_reason === "refusal") throw {code:"refused"};
    const text = (j.content || []).filter(b => b.type === "text").map(b => b.text).join("").trim();
    if (!text) throw {code:"empty_completion"};
    return text;
  };
  const ai = async (p, o) => ({text:await call(p, o), truncated:false});
  ai.json = async (p, o) => { const t = await call(p, o); const v = parseJsonLoose(t); if (v === undefined) throw {code:"invalid_json", text:t}; return v; };

}
/* File saving outside Claude: Android bridge writes to Downloads; browsers get a normal download. */
const webDownloads = {
  async save({filename, data}) {

      return {status:r === "shared" ? "shared" : "saved", where:"device"};
    }
    const url = URL.createObjectURL(new Blob([blob], {type:mime}));
    const a = document.createElement("a"); a.href = url; a.download = filename; a.rel = "noopener";

    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);

};
async function shareBlob(blob, filename, mime) {

  BRIDGE.shareFile(await blobToB64(blob), filename, mime);
}

/* ---------- icons ---------- */
const P_ICONS = {
  home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
  drop:'<path d="M12 3s6.5 7 6.5 11.5a6.5 6.5 0 0 1-13 0C5.5 10 12 3 12 3z"/>',
  trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  sheet:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 9v12"/>',

  camera:'<path d="M4 8h3.2l1.8-3h6l1.8 3H20v12H4z"/><circle cx="12" cy="13.5" r="3.6"/>',
  image:'<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-10 9"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
  bookmark:'<path d="M6 3h12v18l-6-4.5L6 21z"/>',
  pencil:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  pulse:'<path d="M3 12h4l3-7 4 14 3-7h4"/>',
  eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff:'<path d="M2 12s3.6-7 10-7c2 0 3.7.7 5.1 1.6M22 12s-3.6 7-10 7c-2 0-3.7-.7-5.1-1.6"/><path d="M4 4l16 16"/>',
  flame:'<path d="M12 3c.8 3.2 5.5 5.2 5.5 10.5A5.5 5.5 0 0 1 6.5 13.5c0-2.2 1-3.8 2.2-4.8.1 2 1 3.2 2.3 3.4-.4-3 .1-6 1-9.1z"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  left:'<path d="M15 5l-7 7 7 7"/>',
  right:'<path d="M9 5l7 7-7 7"/>',
  spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/>',
  scale:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 10a5 5 0 0 1 7 0"/><path d="M12 10l1.5-1.5"/>',
  shield:'<path d="M12 3l7 3v6c0 4.5-3 7.8-7 9-4-1.2-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/>',
};
const ic = (n, cls = "") => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P_ICONS[n]}</svg>`;
const LOGO = `<svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="19" fill="none" stroke="#f2b04f" stroke-width="3.5"/><path d="M11 22h22a11 11 0 0 1-22 0z" fill="#f2b04f"/><path d="M24 7.5l5.5 12.5M29.5 6.5l4.5 13" stroke="#f5efe6" stroke-width="2.4" stroke-linecap="round"/></svg>`;

/* ---------- reference data ---------- */
const MEALS = ["早餐","午餐","下午茶","晚餐","宵夜","小食"];
const mealByTime = (hm = nowHM()) => { const [h, m] = hm.split(":").map(Number); const t = h + m/60; return t < 10.5 ? "早餐" : t < 14.5 ? "午餐" : t < 17.5 ? "下午茶" : t < 21.5 ? "晚餐" : "宵夜"; };
const EX = [
  {k:"run", name:"跑步", icon:"🏃", met:9.8},
  {k:"walk", name:"急步行", icon:"🚶", met:4.3},
  {k:"gym", name:"重訓", icon:"🏋️", met:5.0},
  {k:"swim", name:"游水", icon:"🏊", met:6.0},
  {k:"bike", name:"踩單車", icon:"🚴", met:6.8},
  {k:"hike", name:"行山", icon:"⛰️", met:6.0},
  {k:"yoga", name:"瑜伽", icon:"🧘", met:2.5},
];
const EX_MORE = [
  {k:"badminton", name:"羽毛球", icon:"🏸", met:5.5},
  {k:"basketball", name:"籃球", icon:"🏀", met:6.5},
  {k:"football", name:"足球", icon:"⚽", met:7.0},
  {k:"tennis", name:"網球", icon:"🎾", met:7.3},
  {k:"pingpong", name:"乒乓波", icon:"🏓", met:4.0},
  {k:"rope", name:"跳繩", icon:"🪢", met:11.8},
  {k:"hiit", name:"HIIT", icon:"🔥", met:8.0},
  {k:"stairs", name:"行樓梯", icon:"🪜", met:8.0},
  {k:"row", name:"划艇機", icon:"🚣", met:7.0},
  {k:"dance", name:"跳舞", icon:"💃", met:5.0},
  {k:"taichi", name:"太極", icon:"☯️", met:3.0},
  {k:"stretch", name:"拉筋", icon:"🤸", met:2.3},
];
const ALL_EX = [...EX, ...EX_MORE];
const exType = k => ALL_EX.find(e => e.k === k);
const ACTS = [
  {v:1.2, l:"坐定定", d:"大部分時間坐住，少運動"},
  {v:1.375, l:"輕度活動", d:"每週運動 1–3 次"},
  {v:1.55, l:"中度活動", d:"每週運動 3–5 次"},
  {v:1.725, l:"好活躍", d:"每週運動 6–7 次"},
  {v:1.9, l:"非常活躍", d:"體力勞動加訓練"},
];
const PACES = [{v:0, l:"維持體重"},{v:0.25, l:"每週減 0.25 kg（溫和）"},{v:0.5, l:"每週減 0.5 kg（建議）"},{v:0.75, l:"每週減 0.75 kg（進取）"}];

/* ---------- state ---------- */
const S = {
  tab:"home", date:today(), weekOffset:0,
  profile:null, days:{}, favs:{foods:[], ex:[]}, photos:{}, photoLoaded:{},
  hide:true, mode:"loading", ready:false,
  ai:null, aiImages:false, dl:null,
  wRange:"90D",
  exp:{range:"7", from:addDays(today(), -6), to:today(), photos:true, personal:false, busy:false, msg:""},
  sheet:null, food:null, exs:null, prof:null,
  pendingRender:false, aiMsg:"",
};
const normFavs = f => ({foods: Array.isArray(f?.foods) ? f.foods : [], ex: Array.isArray(f?.ex) ? f.ex : []});
const emptyDay = d => ({date:d, meals:[], ex:[], water:0, weight:null});
const getDay = d => (S.days[d] ||= emptyDay(d));
const hasLog = d => { const x = S.days[d]; return !!(x && ((x.meals && x.meals.length) || (x.ex && x.ex.length))); };
function totals(d) {
  const t = {kcal:0, p:0, c:0, f:0, ex:0, water:0, n:0};
  if (!d) return t;
  (d.meals || []).forEach(m => { t.kcal += +m.kcal || 0; t.p += +m.p || 0; t.c += +m.c || 0; t.f += +m.f || 0; t.n++; });
  (d.ex || []).forEach(e => { t.ex += +e.kcal || 0; });
  t.water = +d.water || 0;
  return t;
}
function weighIns() {
  return Object.values(S.days).filter(d => d && +d.weight > 0).map(d => ({d:d.date, w:+d.weight})).sort((a, b) => a.d < b.d ? -1 : 1);
}
function curWeight() { const w = weighIns(); return w.length ? w[w.length - 1].w : (+S.profile?.startKg || null); }
function plan() {
  const p = S.profile;
  if (!p || !+p.heightCm || !+p.age || !+p.startKg) return null;
  const w = curWeight();
  const h = +p.heightCm;
  const bmr = r0(10*w + 6.25*h - 5*(+p.age) + (p.sex === "F" ? -161 : 5));

const H = (v, unit = "") => S.hide ? `<span class="masked">••</span>` : `${v}${unit}`;

  write(path, body) {

  saveDay(date) {
    if (this.mode !== "cloud") { this.persistLocal(); return; }
    clearTimeout(this.timers[date]);

      for (const id in ph) if (ph[id].date >= from && ph[id].date <= to) out[id] = ph[id].img;
      return out;
    }
    const snap = await this.db.collection("photos").where("date", ">=", from).where("date", "<=", to).limit(1000).get();
    snap.docs.forEach(d => { const v = d.data(); if (v && v.img) out[d.id] = v.img; });
    return out;
  },
  async initCloud(db) {

    S.profile = pf.exists ? clone(pf.data()) : null;
    S.favs = normFavs(fv.exists ? clone(fv.data()) : null);
    await new Promise(res => {
      let first = true;
      db.collection("days").orderBy("date", "desc").limit(1000).onSnapshot(snap => {
        const m = {};
        snap.docs.forEach(d => { const v = d.data(); if (v && v.date) m[v.date] = clone(v); });
        for (const k in this.timers) if (S.days[k]) m[k] = S.days[k];
        S.days = m; this.cache(); render();

function dbErr(e) {
  const c = e && e.code;

  else if (c === "invalid_argument") toast("冇權限儲存：只有擁有者先可以寫入");
  else if (c === "revoked") toast("存取權已收回，記錄未必儲存到");
  else if (c === "resource_exhausted") toast("操作太密，慢少少再試");

}
async function ensurePhotos(date) {
  if (S.photoLoaded[date] || S.mode === "loading") return;
  S.photoLoaded[date] = true;
  try {
    const got = await Store.photosFor(date, date);

}

/* ---------- rings & charts ---------- */
function ring(frac, size, stroke, color) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac || 0));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>
    ${f > 0 ? `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c*(1-f)).toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"/>` : ""}
  </svg>`;
}
function niceTicks(min, max, n = 4) {
  const span = max - min || 1, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= raw) || raw;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, out = [];
  for (let v = lo; v <= hi + 1e-9; v += step) out.push(Math.round(v * 100) / 100);
  return out;
}
function weightChart(pts, goal) {
  const W = 340, Hh = 190, L = S.hide ? 12 : 38, R = 14, T = 16, B = 26;
  const ws = pts.map(p => p.w).concat(goal ? [goal] : []);
  const ticks = niceTicks(Math.min(...ws) - 0.4, Math.max(...ws) + 0.4, 4);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const t0 = parseYmd(pts[0].d).getTime(), t1 = parseYmd(pts[pts.length - 1].d).getTime(), ts = (t1 - t0) || 1;
  const X = d => L + (parseYmd(d).getTime() - t0) / ts * (W - L - R);
  const Y = w => T + (1 - (w - y0) / (y1 - y0)) * (Hh - T - B);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(p.d).toFixed(1)},${Y(p.w).toFixed(1)}`).join("");
  const area = `${line}L${X(pts[pts.length-1].d).toFixed(1)},${Hh-B}L${X(pts[0].d).toFixed(1)},${Hh-B}Z`;
  const last = pts[pts.length - 1];
  let g = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="體重走勢圖"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2b04f" stop-opacity=".28"/><stop offset="1" stop-color="#f2b04f" stop-opacity="0"/></linearGradient></defs>`;
  ticks.forEach(v => {
    g += `<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/>`;
    if (!S.hide) g += `<text x="${L-6}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--dim)" font-family="Urbanist,sans-serif">${v}</text>`;
  });
  if (goal && goal >= y0 && goal <= y1) {
    g += `<line x1="${L}" x2="${W-R}" y1="${Y(goal).toFixed(1)}" y2="${Y(goal).toFixed(1)}" stroke="var(--teal)" stroke-width="1.5" stroke-dasharray="6 5"/>`;
    g += `<text x="${W-R}" y="${(Y(goal)-6).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--teal)" font-weight="700">目標</text>`;
  }
  g += `<path d="${area}" fill="url(#wg)"/><path d="${line}" fill="none" stroke="var(--amber)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach(p => { g += `<circle cx="${X(p.d).toFixed(1)}" cy="${Y(p.w).toFixed(1)}" r="2.6" fill="var(--amber)"/>`; });
  g += `<circle cx="${X(last.d).toFixed(1)}" cy="${Y(last.w).toFixed(1)}" r="6" fill="var(--bg)" stroke="var(--amber)" stroke-width="3"/>`;
  if (!S.hide) {
    const lx = Math.min(X(last.d), W - R - 22);
    g += `<text x="${lx.toFixed(1)}" y="${(Y(last.w) - 12).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--fg)" font-family="Urbanist,sans-serif">${last.w}</text>`;
  }
  g += `<text x="${L}" y="${Hh-6}" font-size="11" fill="var(--dim)" font-family="Urbanist,sans-serif">${md(pts[0].d)}</text>`;
  g += `<text x="${W-R}" y="${Hh-6}" text-anchor="end" font-size="11" fill="var(--dim)" font-family="Urbanist,sans-serif">${md(last.d)}</text>`;
  return g + `</svg>`;
}
function barChart(days, valFn, limit, color, overColor) {
  const W = 340, Hh = 170, L = 6, R = 6, T = 22, B = 24;
  const vals = days.map(valFn);
  const max = Math.max(limit || 0, ...vals, 1) * 1.08;
  const bw = (W - L - R) / days.length, Y = v => T + (1 - v / max) * (Hh - T - B);
  let g = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="最近 7 日">`;
  g += `<line x1="${L}" x2="${W-R}" y1="${Hh-B}" y2="${Hh-B}" stroke="var(--line)"/>`;
  days.forEach((d, i) => {
    const v = vals[i], x = L + i * bw + bw * 0.2, w = bw * 0.6, y = Y(v);
    const col = limit && v > limit ? overColor : color;
    if (v > 0) g += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${(Hh-B-y).toFixed(1)}" rx="5" fill="${col}"/>`;
    else g += `<rect x="${x.toFixed(1)}" y="${(Hh-B-3).toFixed(1)}" width="${w.toFixed(1)}" height="3" rx="1.5" fill="var(--track)"/>`;
    if (v > 0) g += `<text x="${(x+w/2).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--muted)" font-family="Urbanist,sans-serif">${v >= 10000 ? (v/1000).toFixed(1)+"k" : fmt(v)}</text>`;
    g += `<text x="${(x+w/2).toFixed(1)}" y="${Hh-7}" text-anchor="middle" font-size="11.5" fill="${d === S.date ? "var(--amber)" : "var(--dim)"}" font-weight="${d === S.date ? 700 : 500}">${WD[parseYmd(d).getDay()]}</text>`;
  });
  if (limit) g += `<line x1="${L}" x2="${W-R}" y1="${Y(limit).toFixed(1)}" y2="${Y(limit).toFixed(1)}" stroke="var(--teal)" stroke-width="1.5" stroke-dasharray="6 5"/>`;
  return g + `</svg>`;
}

function exportRange() {

  if (e.range === "month") return {from:t.slice(0, 8) + "01", to:t};
  if (e.range === "all") { const ks = Object.keys(S.days).sort(); return {from:ks[0] || t, to:t}; }

}

function loadImg(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { res(img); setTimeout(() => URL.revokeObjectURL(url), 1000); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("decode")); };
    img.src = url;
  });
}
function drawScaled(img, max) {
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(img.naturalWidth * s)); c.height = Math.max(1, Math.round(img.naturalHeight * s));
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c;
}

    toast(res && res.where === "device" ? "備份已儲存到「下載／Healthy KyoFai」" : "備份已下載");
  } catch (e) { if (e && e.code !== "declined") toast("匯出備份失敗"); }

function restoreFrom(text) {
  let b;
  try { b = JSON.parse(text); } catch (e) { toast("讀唔到呢個檔案"); return; }
  if (!b || b.app !== "shikyuk" || typeof b.days !== "object") { toast("呢個唔係 Healthy KyoFai 嘅備份檔"); return; }
  const changed = new Set(); let nDays = 0;
  if (b.profile && +b.profile.heightCm > 0) S.profile = b.profile;
  for (const [d, raw] of Object.entries(b.days || {})) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || !raw) continue;
    const day = {date:d, meals:Array.isArray(raw.meals) ? raw.meals : [], ex:Array.isArray(raw.ex) ? raw.ex : [], water:+raw.water || 0, weight:+raw.weight > 0 ? +raw.weight : null};
    const cur = S.days[d];
    if (!cur) S.days[d] = day;
    else {
      cur.meals ||= []; cur.ex ||= [];
      const mi = new Set(cur.meals.map(m => m.id)), ei = new Set(cur.ex.map(x => x.id));
      day.meals.forEach(m => { if (!mi.has(m.id)) cur.meals.push(m); });
      day.ex.forEach(x => { if (!ei.has(x.id)) cur.ex.push(x); });
      cur.water = Math.max(+cur.water || 0, day.water);
      if (!(+cur.weight > 0) && day.weight) cur.weight = day.weight;
    }
    changed.add(d); nDays++;
  }
  const fv = normFavs(b.favs);
  const fi = new Set(S.favs.foods.map(x => x.id)), xi = new Set(S.favs.ex.map(x => x.id));
  fv.foods.forEach(x => { if (!fi.has(x.id)) S.favs.foods.push(x); });
  fv.ex.forEach(x => { if (!xi.has(x.id)) S.favs.ex.push(x); });
  const ph = {};
  for (const [id, v] of Object.entries(b.photos || {})) if (v && typeof v.img === "string" && v.img.startsWith("data:image/")) { ph[id] = {date:v.date || "", img:v.img}; S.photos[id] = v.img; }
  if (Store.mode === "cloud") {
    if (S.profile) Store.saveProfile();
    Store.saveFavs();
    changed.forEach(d => Store.write("days/" + d, clone(S.days[d])));
  } else Store.persistLocal();
  if (Object.keys(ph).length) Store.savePhotosBulk(ph);
  S.photoLoaded = {};
  render(true); toast(`已還原 ${nDays} 日記錄`);
}

    case "rmFav": S.favs.foods = S.favs.foods.filter(f => f.id !== b.dataset.id); Store.saveFavs(); renderSheet(); break;
    case "exTab": readExTime(); if (S.exs.tab === "custom") readCustom(); if (S.exs.tab === "common") readExMin(); S.exs.tab = b.dataset.t; S.exs.error = ""; renderSheet(); break;
    case "exSel": readExMin(); readExTime(); S.exs.sel = b.dataset.k; renderSheet(); break;
    case "exMore": readExMin(); readExTime(); S.exs.more = !S.exs.more; renderSheet(); break;
    case "exMin": readExMin(); S.exs.min = Math.max(5, Math.min(600, S.exs.min + Number(b.dataset.d))); { const i = $("#exMinIn"); if (i) i.value = S.exs.min; } updEx(); break;
    case "saveEx": saveEx(); break;
    case "saveCustomEx": saveCustomEx(); break;
    case "stopExAi": S.exs?.ctl?.abort(); break;
    case "delEx": delEx(); break;
    case "useFavEx": { const x = S.favs.ex.find(e => e.id === b.dataset.id); if (x) { const kcal = x.met ? exKcal(x.met, x.min) : r0(x.kcal); if (!kcal) { toast("要先填體重"); break; } readExTime(); pushEx({id:uid(), time:S.exs.time, k:x.k, name:x.name, icon:x.icon, min:x.min, met:x.met, kcal, src:"收藏"}); closeSheet(); render(true); toast(`記低咗：${x.name} ${x.min} 分鐘 · ${fmt(kcal)} kcal`); } } break;
    case "rmFavEx": S.favs.ex = S.favs.ex.filter(e => e.id !== b.dataset.id); Store.saveFavs(); renderSheet(); break;
    case "water": { const d = getDay(S.date); d.water = Math.max(0, (+d.water || 0) + Number(b.dataset.ml)); Store.saveDay(S.date); render(true); } break;
    case "waterCustom": { const v = r0($("#wCustom")?.value); if (v > 0 && v <= 5000) { const d = getDay(S.date); d.water = (+d.water || 0) + v; Store.saveDay(S.date); render(true); toast(`加咗 ${fmt(v)} ml`); } else toast("輸入 1 至 5000 ml"); } break;
    case "weigh": { const v = r1($("#wIn")?.value); if (v >= 30 && v <= 300) { getDay(today()).weight = v; Store.saveDay(today()); render(true); toast(S.hide ? "已記錄今日體重" : `已記錄：${v.toFixed(1)} kg`); } else toast("輸入 30 至 300 kg"); } break;
    case "wRange": S.wRange = b.dataset.r; render(true); break;
    case "expRange": S.exp.range = b.dataset.r; S.exp.msg = ""; render(true); break;
    case "export": exportXlsx("save"); break;
    case "exportShare": exportXlsx("share"); break;
    case "backup": backupNow(); break;
    case "aiSave": aiSave(); break;
    case "aiTest": aiTest(); break;
    case "aiClear": LS.set(K_AI, {key:"", model:aiCfg().model}); applyAiCfg(); S.aiMsg = "已刪除 key。"; render(true); break;
    case "goAi": closeSheet(); S.tab = "me"; render(true); setTimeout(() => { const c = $("#aiCard"); if (c) c.scrollIntoView({behavior:"smooth", block:"start"}); }, 30); break;
    case "editProfile": S.prof = {...(S.profile || {sex:"M", activity:1.2, pace:0.5}), err:""}; if (!S.prof.startKg && S.profile?.weightKg) S.prof.startKg = S.profile.weightKg; openSheet("profile"); break;
    case "pSex": S.prof.sex = b.dataset.v; ["pAge","pH","pW","pG","pWater"].forEach(id => { const el = $("#" + id); if (el) S.prof[{pAge:"age", pH:"heightCm", pW:"startKg", pG:"goalKg", pWater:"waterMl"}[id]] = el.value; }); S.prof.activity = +($("#pAct")?.value || S.prof.activity); S.prof.pace = +($("#pPace")?.value ?? S.prof.pace); renderSheet(); break;
    case "saveProfile": saveProfile(); break;
  }
});
function updEx() {
  const x = S.exs, t = exType(x.sel); if (!t) return;
  const k = $("#exK"), f = $("#exF"); if (k) k.textContent = fmt(exKcal(t.met, x.min)); if (f) f.textContent = exFormula(t.met, x.min);
}
document.addEventListener("input", ev => {
  const t = ev.target;
  if (S.sheet === "food" && S.food?.step === "edit" && t.closest("#fItems")) { readEdit(); const el = $("#fTot"); if (el) el.innerHTML = totHtml(sumItems(S.food.result.items)); }
  if (t.id === "exMinIn") { readExMin(); updEx(); }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.id === "fCam" || t.id === "fLib") { handleFoodPhoto(t.files && t.files[0]); t.value = ""; }
  else if (t.id === "exShot") { exShot(t.files && t.files[0]); t.value = ""; }
  else if (t.id === "restoreIn") { const f = t.files && t.files[0]; t.value = ""; if (f) { const r = new FileReader(); r.onload = () => restoreFrom(String(r.result || "")); r.onerror = () => toast("讀唔到呢個檔案"); r.readAsText(f); } }
  else if (t.id === "expPhotos") { S.exp.photos = t.checked; }
  else if (t.id === "expPersonal") { S.exp.personal = t.checked; render(true); }
  else if (t.id === "expFrom") { S.exp.from = t.value; render(true); }
  else if (t.id === "expTo") { S.exp.to = t.value; render(true); }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && S.sheet && !(S.food?.busy || S.exs?.busy)) closeSheet(); });

/* ---------- boot ---------- */
async function boot() {
  const h = LS.get(K_HIDE); S.hide = h === null ? true : !!h;
  const cache = LS.get(K_CACHE) || LS.get(K_LOCAL);
  if (cache) { S.profile = cache.profile || null; S.days = cache.days || {}; S.favs = normFavs(cache.favs); }
  render(true);
  const use = n => (window.claude && typeof window.claude.use === "function") ? Promise.resolve(window.claude.use(n)).catch(() => null) : Promise.resolve(null);
  const [db, user, sample, dl] = await Promise.all(["db", "user", "sample", "downloads"].map(use));
  S.ai = sample || null; S.dl = dl || null;
  if (sample) { try { const lim = await sample.limits(); S.aiImages = !!(lim && lim.images); } catch (e) { S.aiImages = false; } }
  if (!IN_CLAUDE) { applyAiCfg(); S.dl = webDownloads; }
  let owner = true;
  if (user && typeof user.isOwner === "function") { try { owner = !!(await user.isOwner()); } catch (e) { owner = true; } }
  if (db && owner) {
    try { await Store.initCloud(db); S.mode = "cloud"; }
    catch (e) { Store.mode = "local"; S.mode = "local"; const l = LS.get(K_LOCAL) || {}; S.profile = l.profile || null; S.days = l.days || {}; S.favs = normFavs(l.favs); }
  } else {
    Store.mode = "local"; S.mode = "local";
    const l = LS.get(K_LOCAL) || {}; S.profile = l.profile || null; S.days = l.days || {}; S.favs = normFavs(l.favs);
  }
  S.ready = true; render(); ensurePhotos(S.date);
}
boot();
})();
</script>
